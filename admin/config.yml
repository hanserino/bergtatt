# Decap CMS — https://decapcms.org/
# GitHub Pages trenger OAuth-proxy. Se admin/OAUTH-SETUP.md og fjern kommentar
# på base_url + auth_endpoint når workeren er deployet.

backend:
  name: github
  repo: hanserino/bergtatt
  branch: main
  # OAuth-proxy (Cloudflare Worker) — se admin/OAUTH-SETUP.md
  base_url: https://bergtatt-decap-oauth.hanserino.workers.dev
  auth_endpoint: /auth

# Kun lokalt: npx decap-server (ikke commit til main)
# local_backend: true

site_url: https://bergtattpodcast.no
display_url: https://bergtattpodcast.no
logo_url: https://bergtattpodcast.no/assets/logo/bergtatt-black.png

media_folder: assets/uploads
public_folder: /assets/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: episodes
    label: Episoder
    label_singular: Episode
    folder: "_posts"
    path: "{{year}}-{{month}}-{{day}}-{{episode_slug}}"
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{episode_slug}}"
    fields:
      - label: Layout
        name: layout
        widget: hidden
        default: episode

      - label: Kilde
        name: source
        widget: hidden
        default: decap

      - { label: Tittel, name: title, widget: string, required: true }

      - label: URL-slug
        name: episode_slug
        widget: string
        required: true
        hint: "Kun a–z, 0–9 og bindestrek. Brukes i filnavn og /episoder/…/"
        pattern:
          - "^[a-z0-9][a-z0-9-]*[a-z0-9]$|^[a-z0-9]$"
          - "f.eks. aniek-lith-suser-gjennom-harryland"

      - label: Permalink
        name: permalink
        widget: string
        required: true
        hint: "Må matche slug, f.eks. /episoder/aniek-lith-suser-gjennom-harryland/"
        pattern:
          - "^/episoder/[a-z0-9-]+/$"
          - "Skal starte med /episoder/ og slutte med /"

      - label: Publiseringsdato
        name: date
        widget: datetime
        required: true
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        format: "YYYY-MM-DD HH:mm:ss Z"

      - label: Episodenummer
        name: episode_number
        widget: number
        required: false
        value_type: int
        min: 1

      - label: Varighet
        name: duration
        widget: string
        required: false
        hint: "f.eks. 53:48"

      - label: Kort beskrivelse (SEO)
        name: description
        widget: text
        required: false
        hint: "Vises i Google og deling på sosiale medier (maks ca. 160 tegn)."

      - label: Episodetype
        name: episode_type
        widget: select
        default: full
        options:
          - { label: Full episode, value: full }
          - { label: Trailer, value: trailer }
          - { label: Bonus, value: bonus }

      - label: Kort / hero
        name: hero_image
        widget: image
        required: false
        hint: "Bakgrunnsbilde på episoden og i episodelisten. Last opp her, eller behold eksisterende sti."

      - label: Episodekunst
        name: image
        widget: image
        required: false
        hint: "Kvadratisk cover i episodelisten og for deling (Open Graph). Last opp her."

      - label: Lyd (MP3-URL)
        name: audio_url
        widget: string
        required: false

      - label: Acast-lenke
        name: acast_url
        widget: string
        required: false

      - label: YouTube video-ID
        name: youtube_id
        widget: string
        required: false
        hint: "Kun ID-en, f.eks. LrPQRkNzLsk (fra youtu.be/… eller watch?v=…)"

      - label: YouTube-lenke
        name: youtube_url
        widget: string
        required: false

      - label: Shownotes
        name: body
        widget: markdown
        required: true
